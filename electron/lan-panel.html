<!DOCTYPE html>
<html lang="zh-CN" data-tone="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#faf8f4" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
<title>Folio · 书架</title>
<link rel="stylesheet" href="/assets/panel.css" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-toc" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 6V4h16v2M9 20h6M12 4v16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m3 3 18 18M8.5 8.5A8.6 8.6 0 0 1 21 9M3 9a15 15 0 0 1 3.1-2M5.5 13a10 10 0 0 1 5-2.5M18.5 13a9 9 0 0 0-2.2-1.7M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Folio 局域网面板">
        <span class="brand-mark" aria-hidden="true"><svg><use href="#i-book"/></svg></span>
        <span class="brand-name">Folio</span>
        <span class="brand-tag">私人书房</span>
      </div>
      <div class="topbar-right">
        <button class="sync-status" id="syncStatus" type="button" title="同步状态；点击重新连接">
          <span class="sync-dot" id="syncDot" data-state="idle"></span>
          <span id="syncText">连接中</span>
        </button>
        <button class="icon-btn" id="appearance" title="阅读与外观设置" aria-label="阅读与外观设置"><svg><use href="#i-sun"/></svg></button>
        <button class="icon-btn" id="refresh" title="刷新书架" aria-label="刷新书架"><svg><use href="#i-refresh"/></svg></button>
      </div>
    </header>

    <div class="offline-bar" id="offlineBar" hidden role="status">
      <svg><use href="#i-wifi-off"/></svg>
      <span id="offlineText">与桌面端的连接断开了</span>
      <button id="retryConnection" type="button">重新连接</button>
    </div>

    <main class="shelf-view" id="shelfView">
      <section class="library-intro">
        <div>
          <p class="eyebrow">YOUR QUIET LIBRARY</p>
          <h1>书在这里，<br><em>慢慢读。</em></h1>
        </div>
        <div class="library-stat" aria-label="书架统计">
          <strong id="statReading">0</strong><span>本在读</span>
          <i></i>
          <strong id="statBooks">0</strong><span>本藏书</span>
        </div>
      </section>

      <section class="hero" id="hero" hidden aria-label="继续阅读"></section>

      <section class="shelf">
        <div class="section-head">
          <div><p class="eyebrow">COLLECTION</p><h2>全部书籍<span class="count" id="bookCount">0</span></h2></div>
          <div class="section-actions">
            <span class="section-note" id="readOnlyNote" hidden>只读</span>
            <div class="view-switch" role="group" aria-label="书架布局">
              <button class="active" id="gridLayout" type="button" aria-label="网格视图" aria-pressed="true"><svg><use href="#i-grid"/></svg></button>
              <button id="listLayout" type="button" aria-label="列表视图" aria-pressed="false"><svg><use href="#i-list"/></svg></button>
            </div>
          </div>
        </div>

        <div class="shelf-controls">
          <label class="search-box" for="bookSearch">
            <svg><use href="#i-search"/></svg>
            <input id="bookSearch" type="search" placeholder="搜索书名、作者或章节" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <label class="sort-box">排序
            <select id="bookSort" aria-label="书架排序">
              <option value="recent">最近阅读</option>
              <option value="added">加入书架</option>
              <option value="title">书名</option>
              <option value="progress">阅读进度</option>
            </select>
          </label>
        </div>
        <div class="filter-row" id="bookFilters" role="group" aria-label="筛选书籍">
          <button class="active" data-filter="all" type="button" aria-pressed="true">全部</button>
          <button data-filter="reading" type="button" aria-pressed="false">在读</button>
          <button data-filter="unread" type="button" aria-pressed="false">未读</button>
          <button data-filter="local" type="button" aria-pressed="false">本地书</button>
          <button data-filter="cloud" type="button" aria-pressed="false">云端书</button>
        </div>

        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <span class="empty-mark" aria-hidden="true">“</span>
          <p id="emptyTitle">书架上还没有书。</p>
          <p class="muted" id="emptyText">在桌面端导入书籍之后，这里会自动出现。</p>
          <button class="btn ghost" id="resetFilters" type="button" hidden>清除搜索与筛选</button>
        </div>
      </section>
    </main>

    <section class="reader-view" id="readerView" hidden aria-label="阅读器">
      <header class="reader-bar">
        <button class="icon-btn" id="backToShelf" aria-label="返回书架"><svg><use href="#i-back"/></svg></button>
        <button class="reader-meta" id="readerMeta" type="button" aria-label="打开目录">
          <span class="reader-book" id="readerBook"></span>
          <span class="reader-chapter link" id="readerChapter"></span>
        </button>
        <div class="reader-tools">
          <button class="icon-btn" id="openToc" aria-label="打开目录" title="目录"><svg><use href="#i-toc"/></svg></button>
          <button class="icon-btn" id="readerSettings" aria-label="阅读设置" title="阅读设置"><svg><use href="#i-type"/></svg></button>
        </div>
      </header>

      <div class="remote-notice" id="remoteNotice" hidden>
        <span id="remoteText">桌面端有新的阅读位置</span>
        <button id="goRemote" type="button">前往</button>
        <button id="dismissRemote" type="button" aria-label="忽略"><svg><use href="#i-close"/></svg></button>
      </div>

      <div class="reader-scroll" id="readerScroll">
        <article class="paper" id="paper"></article>
      </div>

      <div class="reader-foot">
        <button class="foot-nav" id="prevChapter" type="button" aria-label="上一章" hidden><svg class="flip"><use href="#i-chevron"/></svg><span>上一章</span></button>
        <div class="reader-progress">
          <div class="progress-caption"><span id="readerPct">0%</span><span class="foot-state" id="footState"></span></div>
          <input class="progress-range" id="progressRange" type="range" min="0" max="1000" value="0" step="1" aria-label="阅读进度" />
        </div>
        <button class="foot-nav" id="nextChapter" type="button" aria-label="下一章" hidden><span>下一章</span><svg><use href="#i-chevron"/></svg></button>
      </div>
    </section>

    <div class="sheet" id="tocSheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="目录">
        <header class="sheet-head">
          <div><p class="eyebrow">CONTENTS</p><span class="sheet-title">目录<span class="sheet-count" id="tocCount"></span></span></div>
          <button class="icon-btn" id="tocClose" type="button" aria-label="关闭目录"><svg><use href="#i-close"/></svg></button>
        </header>
        <div class="sheet-search">
          <label class="search-box" for="tocSearch"><svg><use href="#i-search"/></svg><input id="tocSearch" type="search" placeholder="搜索章节标题" autocomplete="off" /></label>
          <button class="icon-btn locate-btn" id="tocLocate" type="button" title="回到当前章" aria-label="回到当前章"><svg><use href="#i-location"/></svg></button>
        </div>
        <div class="sheet-list" id="tocList"></div>
        <div class="sheet-empty" id="tocEmpty" hidden>没有匹配的章节</div>
      </div>
    </div>

    <div class="sheet" id="prefsSheet" hidden>
      <div class="sheet-panel prefs-panel" role="dialog" aria-modal="true" aria-label="阅读与外观设置">
        <header class="sheet-head">
          <div><p class="eyebrow">MAKE IT YOURS</p><span class="sheet-title">阅读与外观</span></div>
          <button class="icon-btn" id="prefsClose" type="button" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button>
        </header>
        <div class="prefs-body">
          <section class="pref-group">
            <div class="pref-label"><span>页面配色</span><small>只影响这台设备</small></div>
            <div class="theme-choices" id="themeChoices" role="group" aria-label="页面配色">
              <button data-theme-choice="follow" type="button"><i class="theme-swatch follow"></i>跟随桌面</button>
              <button data-theme-choice="paper" type="button"><i class="theme-swatch sw-paper"></i>纸白</button>
              <button data-theme-choice="sepia" type="button"><i class="theme-swatch sepia"></i>米色</button>
              <button data-theme-choice="night" type="button"><i class="theme-swatch night"></i>夜间</button>
            </div>
          </section>
          <section class="pref-group">
            <div class="pref-label"><span>正文字号</span><output id="fontSizeValue">18 px</output></div>
            <div class="stepper"><button id="fontDown" type="button" aria-label="字号减小">A−</button><input id="fontSize" type="range" min="14" max="28" step="1" value="18" aria-label="正文字号"/><button id="fontUp" type="button" aria-label="字号增大">A＋</button></div>
          </section>
          <section class="pref-group pref-split">
            <div><div class="pref-label"><span>行距</span></div><div class="segmented" id="leadingChoices"><button data-leading="1.65" type="button">紧凑</button><button data-leading="1.9" type="button">舒适</button><button data-leading="2.2" type="button">疏朗</button></div></div>
            <div><div class="pref-label"><span>字体</span></div><div class="segmented" id="fontChoices"><button data-font="serif" type="button" class="serif-sample">宋体</button><button data-font="sans" type="button">黑体</button></div></div>
          </section>
          <section class="pref-group">
            <div class="pref-label"><span>正文宽度</span><small>宽屏阅读时更有效</small></div>
            <div class="segmented" id="measureChoices"><button data-measure="narrow" type="button">窄</button><button data-measure="standard" type="button">标准</button><button data-measure="wide" type="button">宽</button></div>
          </section>
          <p class="prefs-note">设置保存在当前浏览器。点正文可收起工具栏；云端书也支持左右滑动翻章。</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer class="foot" id="foot"></footer>
  </div>
  <script src="/assets/panel.js" defer></script>
</body>
</html>
