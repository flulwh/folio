<!DOCTYPE html>
<html lang="zh-CN" data-tone="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
<title>Folio · 书架</title>
<link rel="stylesheet" href="/assets/panel.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5z" />
            <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z" />
          </svg>
        </span>
        <span class="brand-name">Folio</span>
        <span class="brand-tag">局域网</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="refresh" title="刷新书架" aria-label="刷新书架">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 4v5h-5" />
          </svg>
        </button>
        <span class="sync-dot" id="syncDot" data-state="idle" title="同步状态"></span>
      </div>
    </header>

    <main class="shelf-view" id="shelfView">
      <section class="hero" id="hero" hidden></section>

      <section class="shelf">
        <div class="section-head">
          <h2>书架<span class="count" id="bookCount">0</span></h2>
          <span class="section-note" id="readOnlyNote" hidden>只读</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <p>书架上还没有书。</p>
          <p class="muted">在桌面端导入 txt 之后，这里会自动出现。</p>
        </div>
      </section>
    </main>

    <section class="reader-view" id="readerView" hidden>
      <header class="reader-bar">
        <button class="icon-btn" id="backToShelf" aria-label="返回书架">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <div class="reader-meta">
          <span class="reader-book" id="readerBook"></span>
          <button class="reader-chapter" id="readerChapter" type="button" tabindex="-1"></button>
        </div>
        <div class="reader-tools">
          <button class="icon-btn text" id="fontDown" aria-label="字号减小">A−</button>
          <button class="icon-btn text" id="fontUp" aria-label="字号增大">A+</button>
        </div>
      </header>
      <div class="reader-scroll" id="readerScroll">
        <article class="paper" id="paper"></article>
      </div>
      <div class="reader-foot">
        <button class="foot-nav" id="prevChapter" type="button" aria-label="上一章" hidden>上一章</button>
        <span id="readerPct">0%</span>
        <div class="foot-bar"><i id="footBar"></i></div>
        <button class="foot-nav" id="nextChapter" type="button" aria-label="下一章" hidden>下一章</button>
        <span class="foot-state" id="footState"></span>
      </div>
    </section>

    <div class="sheet" id="tocSheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="目录">
        <header class="sheet-head">
          <span class="sheet-title">目录<span class="sheet-count" id="tocCount"></span></span>
          <button class="icon-btn" id="tocClose" type="button" aria-label="关闭目录">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="sheet-list" id="tocList"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer class="foot" id="foot"></footer>
  </div>
  <script src="/assets/panel.js" defer></script>
</body>
</html>
