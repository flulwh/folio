version: 2

updates:
  # 桌面端：npm（Electron / Vite / React 等）
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # 安卓端：Gradle（Kotlin / Compose / Miuix 等）
  - package-ecosystem: gradle
    directory: '/android'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # CI 自身：workflow 里引用的 action 版本
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
