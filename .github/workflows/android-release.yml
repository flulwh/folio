name: Android Release

on:
  push:
    tags: ['android-*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 校验 tag 与 versionName 一致
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#android-}"
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 build.gradle.kts 的 versionName $NAME 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag $GITHUB_REF_NAME == versionName $NAME"

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      # 签名材料只在仓库 secrets 里，构建前还原成临时文件再注入环境变量：
      # build.gradle.kts 缺任一变量会直接失败，不会悄悄回落到 debug 签名。
      - name: 还原 Release 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少签名 secret：FOLIO_$name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folio-release.jks"
          {
            echo "FOLIO_KEYSTORE=$RUNNER_TEMP/folio-release.jks"
            echo "FOLIO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FOLIO_KEY_ALIAS=$KEY_ALIAS"
            echo "FOLIO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --console=plain

      # 兜底断言：必须有签名证书，且不能是 debug 证书（防止 secret 缺失时误发 debug 包）
      - name: 校验 APK 签名不是 debug 证书
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到 $APK"
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "::error::找不到 Android SDK build-tools（ANDROID_HOME=$SDK）"
            exit 1
          fi
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::$SDK/build-tools 下找不到 apksigner"
            exit 1
          fi
          echo "使用 $APKSIGNER"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          # apksigner 34 之前的输出是「Signer #1 certificate DN:」，35+ 变成「V2 Signer: certificate DN:」
          if ! grep -q 'certificate DN:' <<< "$CERTS"; then
            echo "::error::apksigner 未输出签名证书信息"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' <<< "$CERTS"; then
            echo "::error::APK 使用 Android Debug 证书签名，拒绝发布"
            exit 1
          fi
          echo "签名证书检查通过"

      - name: 整理 APK 文件名
        working-directory: .
        run: cp android/app/build/outputs/apk/release/app-release.apk "Folio-${{ steps.meta.outputs.version }}-android.apk"

      - name: 检查该 tag 是否已有 Release
        id: rel
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过（避免覆盖手动发布的说明）"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          name: Android ${{ steps.meta.outputs.version }}
          files: Folio-${{ steps.meta.outputs.version }}-android.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 版本徽章走 shields 动态解析，这里只需把 README 的 APK 直链挪到新版本。
      # 提交失败不影响已发布的 Release，所以 continue-on-error。
      - name: 更新 README 的 APK 直链
        if: steps.rel.outputs.exists == 'false'
        working-directory: .
        shell: bash
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          git checkout -B readme-apk-link FETCH_HEAD
          sed -i -E "/android\.apk/ { s#Folio-[0-9][0-9.]*-android\.apk#Folio-${{ steps.meta.outputs.version }}-android.apk#g; s#android-[0-9][0-9.]*#android-${{ steps.meta.outputs.version }}#g }" README.md
          if git diff --quiet README.md; then
            echo "README 已是最新，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 更新 Android APK 直链到 ${{ steps.meta.outputs.version }}"
          git push origin HEAD:main
