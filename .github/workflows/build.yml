name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # 纯 Android / 文档改动不跑桌面端门禁，省 CI 时间（tag 推送不受 paths 过滤影响）
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/android*.yml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/android*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁与前端构建
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"
            exit 1
          fi
          echo "tag v$TAG == package.json $PKG"

      - name: 安装依赖
        run: npm ci

      - name: 发版门禁（构建前）
        run: npm run check

      - name: 前端构建
        run: npm run build:vite

      - name: 发版门禁（构建后）
        run: npm run check -- --require-dist

      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Windows 四目标打包
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: 打包 NSIS / portable / zip / dir
        # 加 --publish never：否则打 tag 时 electron-builder 会认为要自己发布到 GitHub，
        # 因缺少 GH_TOKEN 直接以 exit 1 结束（产物其实已经打好了）。发布统一交给下面的 Release 步骤。
        run: npx electron-builder --win --publish never
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: 上传安装包产物
        uses: actions/upload-artifact@v7
        with:
          name: Folio-win-x64-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: 检查该 tag 是否已有 Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过自动草稿（避免把手动发布的正式版改回 draft）"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release 草稿
        if: startsWith(github.ref, 'refs/tags/v') && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
