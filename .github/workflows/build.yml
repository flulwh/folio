name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁与前端构建
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"
            exit 1
          fi
          echo "tag v$TAG == package.json $PKG"

      - name: 安装依赖
        run: npm ci

      - name: 发版门禁（构建前）
        run: npm run check

      - name: 前端构建
        run: npm run build:vite

      - name: 发版门禁（构建后）
        run: npm run check -- --require-dist

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Windows 四目标打包
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 打包 NSIS / portable / zip / dir
        run: npx electron-builder --win
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: Folio-win-x64-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release 草稿
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
